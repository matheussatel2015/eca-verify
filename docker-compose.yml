# Local development infrastructure for ECA Verify.
# Credentials here are LOCAL DEV ONLY — never reuse in any shared/remote environment.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eca
      POSTGRES_PASSWORD: eca
      POSTGRES_DB: eca_verify
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eca -d eca_verify"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
